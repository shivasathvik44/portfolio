<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <meta name="description" content="Student portfolio — design, code, and creative work." />
    <meta property="og:title" content="Portfolio" />
    <meta property="og:description" content="Student portfolio — design, code, and creative work." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* Prevent FOUT — hide until fonts load */
      html { visibility: hidden; }
      html.fonts-loaded { visibility: visible; }
    </style>
    <script>
      if ('fonts' in document) {
        Promise.all([
          document.fonts.load('400 1em "DM Mono"'),
          document.fonts.load('700 1em "Syne"'),
        ]).then(() => {
          document.documentElement.classList.add('fonts-loaded');
        }).catch(() => {
          document.documentElement.classList.add('fonts-loaded');
        });
      } else {
        document.documentElement.classList.add('fonts-loaded');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
